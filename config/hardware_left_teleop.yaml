# Left UR7e + left wrist D435i + front D455 commissioning configuration.
# Normal single-arm VR data-collection configuration.
mode: single
front_camera_topic: /front_camera/camera/color/image_raw
controller_topic: /quest3/controllers
control_hz: 125.0
controller_timeout_sec: 0.25

cameras:
  left_wrist: {model: D435i, serial: "420222071502"}
  front: {model: D455, serial: "260922305390"}

arms:
  left_arm:
    role: left
    robot_ip: 192.168.124.58
    base_frame: left_base
    tcp_frame: left_tcp
    front_calibration: calibration/left_base_to_front_camera.yaml
    # The Robotiq closed-fingertip TCP was calibrated and is active on the UR
    # pendant.  RTDE does not call setTcp in this mode, so it does not replace
    # the pendant-selected TCP with an unknown flange offset.
    tcp_source: robot_active_tcp
    tcp_state_topic: /left_arm/tcp_pose
    joint_topic: /left_arm/joint_states
    target_topic: /left_arm/target_tcp_pose
    enabled_topic: /left_arm/teleop_enabled
    gripper_command_topic: /left_arm/gripper_command
    commanded_action_topic: /left_arm/commanded_joint_delta
    # Left controller controls the left arm with a 1:1 relative pose map.
    position_gain: 1.0
    rotation_gain: 1.0
    enable_rotation: true
    # Left trigger controls the gripper independently of the side-grip clutch.
    gripper_close_threshold: 0.15
    # Conservative provisional bounds in left_base.  Confirm these include the
    # intended empty workspace before increasing the gain or enabling rotation.
    workspace_min: [-0.75, -0.75, 0.08]
    workspace_max: [0.75, 0.75, 0.80]

rtde:
  enable_motion: true
  speed: 0.25
  acceleration: 0.70
  lookahead_time: 0.10
  gain: 400
  # At 125 Hz these bounds cap commanded motion at approximately 0.25 m/s
  # and 1.5 rad/s before servoL's own velocity/acceleration limits.
  max_target_jump_m: 0.0020
  max_target_jump_rad: 0.012
  target_timeout_sec: 0.25
  gripper_port: 63352
  # Robotiq register values (0..255): commissioning values kept deliberately
  # low.  The trigger's hold/release selects closed/open at this slow speed.
  gripper_speed: 20
  gripper_force: 25
