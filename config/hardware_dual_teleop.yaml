# Dual UR7e + two wrist D435i + front/side D455 configuration.
# Each arm has independent base-to-front/side results; both cameras stay fixed.
mode: dual
dual_calibration: calibration/dual_arm_camera_transforms.yaml
front_camera_topic: /front_camera/camera/color/image_raw
controller_topic: /quest3/controllers
control_hz: 125.0
controller_timeout_sec: 0.25
min_tcp_separation_m: 0.20

cameras:
  left_wrist: {model: D435i, serial: "420222071502"}
  right_wrist: {model: D435i, serial: "405622072940"}
  front: {model: D455, serial: "260922305390"}
  side: {model: D455, serial: "260922303231"}

arms:
  left_arm:
    role: left
    robot_ip: 192.168.124.61
    base_frame: left_base
    tcp_frame: left_tcp
    front_calibration: calibration/left_base_to_front_camera.yaml
    side_calibration: calibration/left_base_to_side_camera.yaml
    tcp_source: robot_active_tcp
    tcp_state_topic: /left_arm/tcp_pose
    joint_topic: /left_arm/joint_states
    target_topic: /left_arm/target_tcp_pose
    enabled_topic: /left_arm/teleop_enabled
    gripper_command_topic: /left_arm/gripper_command
    commanded_action_topic: /left_arm/commanded_joint_delta
    position_gain: 1.0
    rotation_gain: 1.0
    enable_rotation: true
    gripper_close_threshold: 0.15
    # No software Cartesian workspace limit; use UR controller safety limits.
  right_arm:
    role: right
    robot_ip: 192.168.124.60
    base_frame: right_base
    tcp_frame: right_tcp
    front_calibration: calibration/right_base_to_front_camera.yaml
    side_calibration: calibration/right_base_to_side_camera.yaml
    tcp_source: robot_active_tcp
    tcp_state_topic: /right_arm/tcp_pose
    joint_topic: /right_arm/joint_states
    target_topic: /right_arm/target_tcp_pose
    enabled_topic: /right_arm/teleop_enabled
    gripper_command_topic: /right_arm/gripper_command
    commanded_action_topic: /right_arm/commanded_joint_delta
    position_gain: 1.0
    rotation_gain: 1.0
    enable_rotation: true
    gripper_close_threshold: 0.15
    # No software Cartesian workspace limit; use UR controller safety limits.

# Stream the full 1:1 hand-mapped pose for both arms.
rtde:
  enable_motion: true
  # Disable host translation/rotation clipping for ordinary servoL teleop.
  # UR controller safety settings govern the robot's actual motion.
  limit_cartesian_targets: false
  # Required API placeholders: ur_rtde 1.6.5 servoL/servoJ ignore these two.
  speed: 0.0
  acceleration: 0.0
  lookahead_time: 0.06
  gain: 600
  # These bounds are used by the optional QP-CBF avoidance path only while
  # limit_cartesian_targets=false; ordinary servoL sends the full target.
  max_target_jump_m: 0.0048
  max_target_jump_rad: 0.024
  target_timeout_sec: 0.25
  # Retry RTDE after a robot-side control script loss (E-stop/protective stop).
  rtde_reconnect_interval_sec: 1.0
  gripper_port: 63352
  gripper_speed: 255
  gripper_force: 20

obstacle_avoidance:
  # Dedicated no-camera teleop keeps using the last published OBBs even when
  # their capture age exceeds safety.stale_timeout_s. Other safety callers
  # retain the project's 2.0 s limit.
  ignore_snapshot_age: true
