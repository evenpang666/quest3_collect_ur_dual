# Minimal left-arm bring-up observed on 2026-09-08.
# Camera identities were re-enumerated after the wrist camera was replaced.
mode: single
front_camera_topic: /front_camera/camera/color/image_raw
controller_topic: /quest3/controllers
control_hz: 125.0
controller_timeout_sec: 0.25
min_tcp_separation_m: 0.20

debug:
  # This bypass is accepted only while rtde.enable_motion is false.
  allow_uncalibrated_receive_only: true

cameras:
  left_wrist: {model: D435i, serial: "420222071502"}
  front: {model: D455, serial: "260922305390"}

arms:
  left_arm:
    role: left
    robot_ip: 192.168.124.61
    base_frame: left_base
    tcp_frame: left_tcp
    front_calibration: calibration/left_base_to_front_camera.yaml
    side_calibration: calibration/left_base_to_side_camera.yaml
    tcp_calibration: calibration/left_tcp.yaml
    tcp_state_topic: /left_arm/tcp_pose
    joint_topic: /left_arm/joint_states
    target_topic: /left_arm/target_tcp_pose
    enabled_topic: /left_arm/teleop_enabled
    gripper_command_topic: /left_arm/gripper_command
    commanded_action_topic: /left_arm/commanded_joint_delta
    position_gain: 1.0
    rotation_gain: 1.0
    enable_rotation: true
    workspace_min: [-0.80, -0.80, 0.02]
    workspace_max: [0.80, 0.80, 1.20]

rtde:
  # DO NOT enable motion with this uncalibrated debug configuration.
  enable_motion: false
  speed: 0.05
  acceleration: 0.10
  lookahead_time: 0.10
  gain: 200
  max_target_jump_m: 0.0005
  max_target_jump_rad: 0.004
  target_timeout_sec: 0.25
  gripper_port: 63352
  gripper_speed: 64
  gripper_force: 50
