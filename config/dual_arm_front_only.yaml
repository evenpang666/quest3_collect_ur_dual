# Temporary dual-arm recording schema while side D455 is not connected.
# It records both wrist RGB streams and front RGB-D, joint state and action.
mode: dual
record_topic: /quest3/recording
max_skew_sec: 0.050
max_joint_interp_gap_sec: 0.100
source_buffer_size: 30
writer_queue_size: 30
rgb_storage: raw_lzf
jpeg_quality: 90
# HDF5 appends samples to one sequential file; this is substantially faster
# than creating several image files for every live sample.
storage_backend: hdf5

cameras:
  left_wrist:
    rgb_topic: /left_wrist_camera/camera/color/image_raw
  right_wrist:
    rgb_topic: /right_wrist_camera/camera/color/image_raw
  front:
    rgb_topic: /front_camera/camera/color/image_raw
    depth_topic: /front_camera/camera/aligned_depth_to_color/image_raw
    # D455 publishes 1280x720 for Quest; HDF5 front RGB-D remains 640x480.
    record_size: [640, 480]

arms:
  left_arm:
    joint_topic: /left_arm/joint_states
    commanded_action_topic: /left_arm/commanded_joint_delta
    gripper_position_topic: /left_arm/gripper_position
    gripper_command_topic: /left_arm/gripper_command
    joint_order: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
  right_arm:
    joint_topic: /right_arm/joint_states
    commanded_action_topic: /right_arm/commanded_joint_delta
    gripper_position_topic: /right_arm/gripper_position
    gripper_command_topic: /right_arm/gripper_command
    joint_order: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
