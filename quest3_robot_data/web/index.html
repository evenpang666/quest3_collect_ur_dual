<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quest 3 双臂遥操作</title>
<style>
body{margin:0;background:#10131a;color:#eef3ff;font:17px system-ui,sans-serif}main{max-width:760px;margin:5vh auto;padding:24px}
button{font-size:1rem;padding:.75rem 1rem;margin:.3rem}.danger{background:#9d2635;color:white}#status{white-space:pre-wrap;line-height:1.55;padding:1rem;background:#1d2430;border-radius:8px}.hint{color:#b8c5dc}
</style>
<main>
  <h1>Quest 3 → UR7e 双臂遥操作</h1>
  <p class="hint">页面版本：orientation-v2</p>
  <p class="hint">左手柄→左臂，右手柄→右臂。按住侧握把才移动对应机械臂；扳机独立控制对应夹爪：按住缓慢合拢，松开缓慢张开。左手 Y 或右手 B 键切换录制，左右摇杆按下分别重新锚定。</p>
  <button id="connect">连接</button><button id="enter" disabled>进入 VR</button>
  <button id="record" class="danger" disabled>开始录制</button>
  <button id="recenterLeft" disabled>左臂重新锚定</button><button id="recenterRight" disabled>右臂重新锚定</button>
  <div id="status">等待连接…</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id), status=$('status'), connect=$('connect'), enter=$('enter'), record=$('record');
let ws,session,space,gl,layer,renderer,lastSent=0,recording=false,recordingStartMs=null,previewCanvas=null,previewContext=null;
const imageStreams={front:{last:0,pending:false},left_wrist:{last:0,pending:false},right_wrist:{last:0,pending:false}};
let recenterLeft=false,recenterRight=false,lastRecordLeft=false,lastRecordRight=false;
const set=t=>status.textContent=t;
function recordingElapsed(){return recording&&recordingStartMs!==null?(performance.now()-recordingStartMs)/1000:0}
function formatDuration(seconds){const total=Math.max(0,Math.floor(seconds));return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`}
function applyRecordingState(value,elapsed){const next=!!value;if(next){const seconds=Number(elapsed);if(Number.isFinite(seconds))recordingStartMs=performance.now()-Math.max(0,seconds)*1000;else if(!recording)recordingStartMs=performance.now()}else recordingStartMs=null;recording=next;record.textContent=next?'停止并保存':'开始录制'}
function button(src,i){return src?.gamepad?.buttons?.[i]?.value||0}
function controller(src,frame){
  if(!src)return null; const pose=frame.getPose(src.gripSpace||src.targetRaySpace,space); if(!pose)return null;
  const p=pose.transform.position,q=pose.transform.orientation;
  return {position:[p.x,p.y,p.z],orientation:[q.x,q.y,q.z,q.w],trigger:button(src,0),squeeze:button(src,1),thumbstick:button(src,3),secondary:button(src,5)};
}
function send(value){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(value))}
function setRecording(value){applyRecordingState(value);send({type:'record',recording:value})}
function connectWs(){
  if(ws?.readyState===WebSocket.OPEN)return;
  ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);
  ws.onopen=()=>{connect.disabled=true;enter.disabled=false;record.disabled=false;set('服务器已连接；进入 VR 后先小幅验证左右臂映射。')};
  ws.onclose=()=>{connect.disabled=false;enter.disabled=true;record.disabled=true;recording=false;set('连接断开：录制已停止，机械臂 watchdog 将停止运动。')};
  ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='status'){applyRecordingState(d.recording,d.recording_elapsed_sec);set(`VR连接: 是\n录制: ${recording?'进行中':'未录制'} ${recording?formatDuration(recordingElapsed()):''}\n同步帧: ${d.synced_frames??'-'}\n丢帧: ${d.dropped_frames??'-'}\n左臂: ${d.left_arm??'等待'} / ${d.left_arm_rtde??'RTDE等待'}\n左夹爪: ${d.left_arm_gripper??'等待'}\n右臂: ${d.right_arm??'等待'} / ${d.right_arm_rtde??'RTDE等待'}\n右夹爪: ${d.right_arm_gripper??'未连接'}\n双臂距离保护: ${d.dual_tcp_guard??'-'}`)}};
}
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function program(v,f){const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,v));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);return p}
function makeRenderer(){
 const p=program('attribute vec3 p;attribute vec2 u;uniform mat4 m;varying vec2 v;void main(){v=u;gl_Position=m*vec4(p,1.);}','precision mediump float;uniform sampler2D t;varying vec2 v;void main(){gl_FragColor=texture2D(t,v);}');
 function panel(left,bottom,right,top,blank){
  // DOM image sources use a top-left origin; all camera views use this same UV layout.
  const verts=new Float32Array([left,bottom,-1.6,0,1,right,bottom,-1.6,1,1,right,top,-1.6,1,0,left,bottom,-1.6,0,1,right,top,-1.6,1,0,left,top,-1.6,0,0]);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,verts,gl.STATIC_DRAW);
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(blank));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return {b,t};
 }
 return {
  p,a:gl.getAttribLocation(p,'p'),u:gl.getAttribLocation(p,'u'),m:gl.getUniformLocation(p,'m'),
  // The front panel is unchanged. Smaller wrist panels flank it.
  panels:{
   front:panel(-1,.65,1,1.775,[15,25,40,255]),
   left_wrist:panel(-2.08,.93,-1.08,1.492,[0,0,0,255]),
   right_wrist:panel(1.08,.93,2.08,1.492,[0,0,0,255]),
  },
 };
}
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}
function updatePreviewTexture(bitmap){
 const width=bitmap.width,height=bitmap.height;
 if(!previewCanvas||previewCanvas.width!==width||previewCanvas.height!==height){previewCanvas=document.createElement('canvas');previewCanvas.width=width;previewCanvas.height=height;previewContext=previewCanvas.getContext('2d')}
 previewContext.drawImage(bitmap,0,0,width,height);
 const fontSize=Math.max(20,Math.round(width*.030)),pad=Math.round(fontSize*.55);
 const label=recording?`● 正在录制 ${formatDuration(recordingElapsed())}  |  按 Y / B 停止并保存`:'未录制  |  按左手 Y 或右手 B 开始录制';
 previewContext.font=`700 ${fontSize}px sans-serif`;const textWidth=previewContext.measureText(label).width;
 previewContext.fillStyle=recording?'rgba(180,20,35,.88)':'rgba(10,18,32,.78)';previewContext.fillRect(pad,pad,textWidth+pad*2,fontSize+pad*2);
 previewContext.fillStyle='#fff';previewContext.fillText(label,pad*2,pad*2+fontSize*.80);
 gl.bindTexture(gl.TEXTURE_2D,renderer.panels.front.t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,previewCanvas);
}
function updateWristTexture(camera,bitmap){gl.bindTexture(gl.TEXTURE_2D,renderer.panels[camera].t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bitmap)}
async function updateImage(camera,now){
 const stream=imageStreams[camera],period=camera==='front'?66:100;
 if(stream.pending||now-stream.last<period)return;stream.pending=true;stream.last=now;
 try{const r=await fetch('/'+camera+'.jpg?t='+Math.floor(now),{cache:'no-store'});if(!r.ok)return;const bm=await createImageBitmap(await r.blob());if(camera==='front')updatePreviewTexture(bm);else updateWristTexture(camera,bm);bm.close()}catch(_){}finally{stream.pending=false}
}
function updateImages(now){for(const camera of Object.keys(imageStreams))updateImage(camera,now)}
function render(frame){const viewer=frame.getViewerPose(space);if(!viewer)return;gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);gl.clearColor(.02,.04,.08,1);gl.clear(gl.COLOR_BUFFER_BIT);for(const view of viewer.views){const vp=layer.getViewport(view);gl.viewport(vp.x,vp.y,vp.width,vp.height);gl.useProgram(renderer.p);for(const panel of Object.values(renderer.panels)){gl.bindTexture(gl.TEXTURE_2D,panel.t);gl.bindBuffer(gl.ARRAY_BUFFER,panel.b);gl.enableVertexAttribArray(renderer.a);gl.vertexAttribPointer(renderer.a,3,gl.FLOAT,false,20,0);gl.enableVertexAttribArray(renderer.u);gl.vertexAttribPointer(renderer.u,2,gl.FLOAT,false,20,12);gl.uniformMatrix4fv(renderer.m,false,mul(view.projectionMatrix,view.transform.inverse.matrix));gl.drawArrays(gl.TRIANGLES,0,6)}}}
function onFrame(now,frame){
 session.requestAnimationFrame(onFrame);updateImages(now);render(frame);
 const sources=[...session.inputSources],l=controller(sources.find(s=>s.handedness==='left'),frame),r=controller(sources.find(s=>s.handedness==='right'),frame);
 if(l?.thumbstick>.5)recenterLeft=true;if(r?.thumbstick>.5)recenterRight=true;
 // Quest Touch's upper face buttons are Y (left) and B (right).  Toggle only
 // on a press edge, so either hand can record without repeated toggles while held.
 const recordLeft=!!(l?.secondary>.5),recordRight=!!(r?.secondary>.5);
 if((recordLeft&&!lastRecordLeft)||(recordRight&&!lastRecordRight))setRecording(!recording);
 lastRecordLeft=recordLeft;lastRecordRight=recordRight;
 if(now-lastSent>=1000/90){send({type:'pose',left:l,right:r,recenter_left:recenterLeft,recenter_right:recenterRight,xr_time_ms:now});recenterLeft=false;recenterRight=false;lastSent=now}
}
async function startVr(){
 if(!navigator.xr){set('当前浏览器没有 WebXR；请在 Quest Browser 中通过 localhost/HTTPS 打开。');return}
 try{session=await navigator.xr.requestSession('immersive-vr',{requiredFeatures:['local-floor']});const canvas=document.createElement('canvas');gl=canvas.getContext('webgl',{xrCompatible:true});await gl.makeXRCompatible();layer=new XRWebGLLayer(session,gl);session.updateRenderState({baseLayer:layer});space=await session.requestReferenceSpace('local-floor');renderer=makeRenderer();session.addEventListener('end',()=>{send({type:'pose',left:null,right:null});setRecording(false);session=null});session.requestAnimationFrame(onFrame)}catch(e){set(`无法进入 VR: ${e.message}`)}
}
connect.onclick=connectWs;enter.onclick=startVr;record.onclick=()=>setRecording(!recording);
$('recenterLeft').onclick=()=>recenterLeft=true;$('recenterRight').onclick=()=>recenterRight=true;
enter.addEventListener('click',()=>{$('recenterLeft').disabled=false;$('recenterRight').disabled=false});
set(location.hostname==='localhost'||location.protocol==='https:'?'点击“连接”。':'WebXR 需要 HTTPS，或使用 adb reverse 后访问 localhost。');
})();
</script>
</html>
