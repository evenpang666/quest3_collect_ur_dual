<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quest 3 双臂遥操作</title>
<style>
body{margin:0;background:#10131a;color:#eef3ff;font:17px system-ui,sans-serif}main{max-width:760px;margin:5vh auto;padding:24px}
button{font-size:1rem;padding:.75rem 1rem;margin:.3rem}.danger{background:#9d2635;color:white}#status{white-space:pre-wrap;line-height:1.55;padding:1rem;background:#1d2430;border-radius:8px}.hint{color:#b8c5dc}
</style>
<main>
  <h1>Quest 3 → UR7e 双臂遥操作</h1>
  <p class="hint">页面版本：passthrough-v2（现实透视 + 录制提示）</p>
  <p class="hint">左手柄→左臂，右手柄→右臂。按住侧握把才移动对应机械臂；扳机独立控制对应夹爪：按住缓慢合拢，松开缓慢张开。左手 Y 或右手 B 键切换录制，左右摇杆按下分别重新锚定。</p>
  <button id="connect">连接</button><button id="enter" disabled>进入现实透视</button>
  <button id="record" class="danger" disabled>开始录制</button>
  <button id="recenterLeft" disabled>左臂重新锚定</button><button id="recenterRight" disabled>右臂重新锚定</button>
  <div id="status">等待连接…</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id), status=$('status'), connect=$('connect'), enter=$('enter'), record=$('record');
let ws,session,space,gl,layer,renderer,lastSent=0,recording=false,recordingStartMs=null,recordingInterrupted='';
let recenterLeft=false,recenterRight=false,lastRecordLeft=false,lastRecordRight=false;
const set=t=>status.textContent=t;
function recordingElapsed(){return recording&&recordingStartMs!==null?(performance.now()-recordingStartMs)/1000:0}
function formatDuration(seconds){const total=Math.max(0,Math.floor(seconds));return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`}
function applyRecordingState(value,elapsed,interrupted){const next=!!value;if(interrupted===null)recordingInterrupted='';else if(typeof interrupted==='string'&&interrupted)recordingInterrupted=interrupted;if(next){recordingInterrupted='';const seconds=Number(elapsed);if(Number.isFinite(seconds))recordingStartMs=performance.now()-Math.max(0,seconds)*1000;else if(!recording)recordingStartMs=performance.now()}else recordingStartMs=null;recording=next;record.textContent=next?'停止并保存':'开始录制'}
function button(src,i){return src?.gamepad?.buttons?.[i]?.value||0}
function controller(src,frame){
  if(!src)return null; const pose=frame.getPose(src.gripSpace||src.targetRaySpace,space); if(!pose)return null;
  const p=pose.transform.position,q=pose.transform.orientation;
  return {position:[p.x,p.y,p.z],orientation:[q.x,q.y,q.z,q.w],trigger:button(src,0),squeeze:button(src,1),thumbstick:button(src,3),secondary:button(src,5)};
}
function send(value){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(value))}
function setRecording(value){applyRecordingState(value,undefined,value?null:undefined);send({type:'record',recording:value})}
function connectWs(){
  if(ws?.readyState===WebSocket.OPEN)return;
  ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);
  ws.onopen=()=>{connect.disabled=true;enter.disabled=false;record.disabled=false;set('服务器已连接；进入现实透视后先小幅验证左右臂映射。')};
  ws.onclose=()=>{connect.disabled=false;enter.disabled=true;record.disabled=true;applyRecordingState(false,undefined,'连接断开：录制已停止');set('连接断开：录制已停止，机械臂 watchdog 将停止运动。')};
  ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='status'){applyRecordingState(d.recording,d.recording_elapsed_sec,d.recording_interrupted);const interrupt=recordingInterrupted?`\n⚠ 录制中断: ${recordingInterrupted}`:'';set(`VR连接: 是\n录制: ${recording?'进行中':'未录制'} ${recording?formatDuration(recordingElapsed()):''}${interrupt}\n同步帧: ${d.synced_frames??'-'}\n丢帧: ${d.dropped_frames??'-'}\n左臂: ${d.left_arm??'等待'} / ${d.left_arm_rtde??'RTDE等待'}\n左夹爪: ${d.left_arm_gripper??'等待'}\n右臂: ${d.right_arm??'等待'} / ${d.right_arm_rtde??'RTDE等待'}\n右夹爪: ${d.right_arm_gripper??'未连接'}\n双臂距离保护: ${d.dual_tcp_guard??'-'}`)}};
}
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function program(v,f){const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,v));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);return p}
function makeRenderer(){
 const p=program('attribute vec3 p;attribute vec2 u;uniform mat4 m;varying vec2 v;void main(){v=u;gl_Position=m*vec4(p,1.);}','precision mediump float;uniform sampler2D t;varying vec2 v;void main(){gl_FragColor=texture2D(t,v);}');
 function panel(left,bottom,right,top,blank){
  // Canvas textures use a top-left origin.
  const verts=new Float32Array([left,bottom,-1.6,0,1,right,bottom,-1.6,1,1,right,top,-1.6,1,0,left,bottom,-1.6,0,1,right,top,-1.6,1,0,left,top,-1.6,0,0]);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,verts,gl.STATIC_DRAW);
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(blank));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  return {b,t};
 }
 return {
  p,a:gl.getAttribLocation(p,'p'),u:gl.getAttribLocation(p,'u'),m:gl.getUniformLocation(p,'m'),
  // A head-following HUD stays in the upper view, close enough to center to read.
  hud:panel(-.72,.12,.72,.36,[0,0,0,0]),
  canvas:Object.assign(document.createElement('canvas'),{width:1440,height:240}),
  labelKey:null,
 };
}
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}
function updateRecordingHud(){
 const label=recordingInterrupted?'⚠ 录制已中断':(recording?`● 正在录制 ${formatDuration(recordingElapsed())}`:'未录制');
 const hint=recordingInterrupted||'按左手 Y / 右手 B '+(recording?'停止并保存':'开始录制');
 const key=label+'\n'+hint;if(renderer.labelKey===key)return;renderer.labelKey=key;
 const canvas=renderer.canvas,ctx=canvas.getContext('2d');
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle=recordingInterrupted?'rgba(150,80,0,.92)':(recording?'rgba(150,15,30,.88)':'rgba(10,18,32,.78)');
 ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='#fff';ctx.font='700 48px sans-serif';ctx.fillText(label,32,64);
 ctx.font='36px sans-serif';
 // Wrap interruption reasons instead of clipping them off the HUD.
 let line='',y=128;
 for(const char of hint){if(ctx.measureText(line+char).width>canvas.width-64){ctx.fillText(line,32,y);line='';y+=48}line+=char}
 ctx.fillText(line,32,y);
 gl.bindTexture(gl.TEXTURE_2D,renderer.hud.t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
 gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,canvas);
}
function render(frame){
 const viewer=frame.getViewerPose(space);if(!viewer)return;
 updateRecordingHud();gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);
 // Zero alpha lets the XR compositor show Quest's real-world passthrough.
 gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.useProgram(renderer.p);
 gl.bindTexture(gl.TEXTURE_2D,renderer.hud.t);gl.bindBuffer(gl.ARRAY_BUFFER,renderer.hud.b);
 gl.enableVertexAttribArray(renderer.a);gl.vertexAttribPointer(renderer.a,3,gl.FLOAT,false,20,0);
 gl.enableVertexAttribArray(renderer.u);gl.vertexAttribPointer(renderer.u,2,gl.FLOAT,false,20,12);
 for(const view of viewer.views){
  const vp=layer.getViewport(view);gl.viewport(vp.x,vp.y,vp.width,vp.height);
  // Place the HUD relative to the viewer, with the proper offset for each eye.
  gl.uniformMatrix4fv(renderer.m,false,mul(view.projectionMatrix,mul(view.transform.inverse.matrix,viewer.transform.matrix)));
  gl.drawArrays(gl.TRIANGLES,0,6);
 }
}
function onFrame(now,frame){
 session.requestAnimationFrame(onFrame);render(frame);
 const sources=[...session.inputSources],l=controller(sources.find(s=>s.handedness==='left'),frame),r=controller(sources.find(s=>s.handedness==='right'),frame);
 if(l?.thumbstick>.5)recenterLeft=true;if(r?.thumbstick>.5)recenterRight=true;
 // Quest Touch's upper face buttons are Y (left) and B (right).  Toggle only
 // on a press edge, so either hand can record without repeated toggles while held.
 const recordLeft=!!(l?.secondary>.5),recordRight=!!(r?.secondary>.5);
 if((recordLeft&&!lastRecordLeft)||(recordRight&&!lastRecordRight))setRecording(!recording);
 lastRecordLeft=recordLeft;lastRecordRight=recordRight;
 if(now-lastSent>=1000/90){send({type:'pose',left:l,right:r,recenter_left:recenterLeft,recenter_right:recenterRight,xr_time_ms:now});recenterLeft=false;recenterRight=false;lastSent=now}
}
async function startVr(){
 if(session)return;
 if(!navigator.xr){set('当前浏览器没有 WebXR；请在 Quest Browser 中通过 localhost/HTTPS 打开。');return}
 enter.disabled=true;
 try{
  session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['local-floor']});
  session.addEventListener('end',()=>{
   send({type:'pose',left:null,right:null});setRecording(false);session=null;
   enter.disabled=ws?.readyState!==WebSocket.OPEN;
   $('recenterLeft').disabled=true;$('recenterRight').disabled=true;
  });
  if(session.environmentBlendMode!=='alpha-blend')throw Error('当前会话不支持透明现实透视，请检查 Quest Browser 与系统版本');
  const canvas=document.createElement('canvas');gl=canvas.getContext('webgl',{xrCompatible:true,alpha:true,premultipliedAlpha:true});
  if(!gl)throw Error('无法创建 WebGL 渲染上下文');
  await gl.makeXRCompatible();layer=new XRWebGLLayer(session,gl,{alpha:true});
  session.updateRenderState({baseLayer:layer});space=await session.requestReferenceSpace('local-floor');
  renderer=makeRenderer();lastRecordLeft=false;lastRecordRight=false;
  $('recenterLeft').disabled=false;$('recenterRight').disabled=false;
  session.requestAnimationFrame(onFrame);
 }catch(e){
  if(session)await session.end();
  enter.disabled=ws?.readyState!==WebSocket.OPEN;
  set(`无法进入现实透视: ${e.message}。请使用支持 immersive-ar 的 Quest Browser，并允许进入沉浸式会话。`);
 }
}
connect.onclick=connectWs;enter.onclick=startVr;record.onclick=()=>setRecording(!recording);
$('recenterLeft').onclick=()=>recenterLeft=true;$('recenterRight').onclick=()=>recenterRight=true;
set(location.hostname==='localhost'||location.protocol==='https:'?'点击“连接”。':'WebXR 需要 HTTPS，或使用 adb reverse 后访问 localhost。');
})();
</script>
</html>
